<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f766e">
    <title>Gửi ảnh về kho</title>
    <style>
        /* Một bộ màu chung cho mọi dự án */
        :root {
            --bg: #f3f5f7; --card: #ffffff; --ink: #1f2933; --muted: #6b7785;
            --line: #dfe4ea; --accent: #0f766e; --accent-dark: #0b5a54; --accent-soft: #e6f4f2;
            --ok: #15803d; --err: #b91c1c; --warn: #b45309;
        }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: 'Segoe UI', system-ui, Arial, sans-serif; background: var(--bg); color: var(--ink);
               min-height: 100vh; display: flex; justify-content: center; padding: 16px; }
        .card { background: var(--card); width: 100%; max-width: 480px; border-radius: 16px; padding: 22px 20px 20px;
                box-shadow: 0 2px 14px rgba(15, 23, 42, .08); align-self: flex-start; }
        .brand { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); font-weight: 700; margin: 0 0 4px; }
        h1 { font-size: 1.3rem; margin: 0 0 4px; line-height: 1.25; }
        .sub { color: var(--muted); font-size: .88rem; margin: 0 0 18px; }
        .step { font-weight: 700; font-size: .88rem; margin: 0 0 8px; }
        .step span { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%;
                     background: var(--accent); color: #fff; font-size: .75rem; margin-right: 6px; }
        .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
        .chip { border: 1.5px solid var(--line); background: #fff; color: var(--ink); padding: 9px 13px; border-radius: 999px;
                font-size: .9rem; cursor: pointer; font-family: inherit; }
        .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
        .pick { border: 2px dashed var(--accent); background: var(--accent-soft); border-radius: 14px; padding: 22px 12px;
                text-align: center; cursor: pointer; margin-bottom: 12px; color: var(--accent-dark); font-weight: 600; }
        .pick small { display: block; font-weight: 400; color: var(--muted); margin-top: 4px; }
        .thumbs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 12px; }
        .thumbs img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; background: var(--line); }
        .thumbs .more { display: grid; place-items: center; aspect-ratio: 1; border-radius: 8px; background: var(--line); color: var(--muted); font-size: .85rem; }
        details { margin-bottom: 14px; font-size: .88rem; color: var(--muted); }
        details summary { cursor: pointer; padding: 4px 0; }
        details label { display: flex; align-items: center; gap: 8px; padding: 5px 0; color: var(--ink); }
        .btn { width: 100%; border: 0; border-radius: 12px; padding: 15px; background: var(--accent); color: #fff; font-size: 1.02rem;
               font-weight: 700; cursor: pointer; font-family: inherit; }
        .btn:hover { background: var(--accent-dark); }
        .btn:disabled { opacity: .45; cursor: not-allowed; }
        .btn.ghost { background: #fff; color: var(--accent); border: 1.5px solid var(--accent); margin-top: 10px; }
        .bar { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; margin-top: 14px; display: none; }
        .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s; }
        .status { text-align: center; font-size: .9rem; margin-top: 10px; font-weight: 600; min-height: 1.2em; }
        .results { margin-top: 12px; font-size: .82rem; background: var(--bg); border-radius: 10px; padding: 10px; max-height: 160px; overflow: auto; display: none; }
        .results a { color: var(--accent); }
        .menu a { display: block; padding: 14px 16px; margin-bottom: 8px; border-radius: 12px; background: var(--bg); color: var(--ink);
                  text-decoration: none; font-weight: 600; border: 1.5px solid transparent; }
        .menu a:hover { border-color: var(--accent); background: var(--accent-soft); }
        .foot { text-align: center; color: var(--muted); font-size: .72rem; margin-top: 16px; }
    </style>
</head>
<body>

<div class="card">
    <p class="brand">Kho ảnh dự án</p>
    <h1 id="title">Đang tải...</h1>
    <p class="sub" id="sub"></p>
    <div id="body"></div>
    <p class="foot" id="foot"></p>
</div>

<canvas id="canvas" style="display:none;"></canvas>

<script>
(async function () {
    const $ = (id) => document.getElementById(id);
    const body = $('body');
    const pid0 = new URLSearchParams(location.search).get('p');

    let cfg;
    try { cfg = await (await fetch('du_an.json', { cache: 'no-cache' })).json(); }
    catch (e) { $('title').innerText = 'Không tải được cấu hình'; $('sub').innerText = 'Kiểm tra mạng rồi tải lại trang.'; return; }

    // Link cũ (không có ?p=) mở dự án mặc định; ?p=menu hiện danh sách
    const pid = pid0 === null && cfg.mac_dinh ? cfg.mac_dinh : (pid0 === 'menu' ? null : pid0);
    let proj = cfg.projects[pid];
    // Khách mới: mã hợp lệ nhưng chưa khai báo -> cấu hình mặc định, Drive tự tạo thư mục
    if (!proj && pid && /^[a-z0-9][a-z0-9-]{1,39}$/.test(pid)) {
        proj = { ten: pid.replace(/-/g, ' ').replace(/\b\w/g, (m) => m.toUpperCase()), watermark: '', categories: cfg.mac_dinh_nhom };
    }
    if (!proj) {
        $('title').innerText = 'Chọn dự án';
        $('sub').innerText = pid ? 'Không thấy dự án "' + pid + '". Chọn lại bên dưới.' : 'Chọn dự án của bạn để gửi ảnh.';
        body.className = 'menu';
        Object.entries(cfg.projects).forEach(([k, v]) => {
            const a = document.createElement('a'); a.href = '?p=' + k; a.textContent = v.ten; body.appendChild(a);
        });
        return;
    }

    const endpoint = proj.endpoint || cfg.endpoint;
    document.title = proj.ten + ' - Gửi ảnh';
    $('title').innerText = proj.ten;
    $('sub').innerText = 'Chọn nhóm, chọn ảnh, bấm gửi. Ảnh tự vào Drive của dự án.';
    $('foot').innerText = 'Mã dự án: ' + pid;

    body.innerHTML = `
        <p class="step"><span>1</span>Ảnh thuộc nhóm nào?</p>
        <div class="chips" id="chips"></div>
        <p class="step"><span>2</span>Chọn ảnh hoặc video</p>
        <div class="pick" id="pick">📸 Chạm để chọn hoặc chụp ảnh / quay video<small id="hint">Chọn được nhiều file cùng lúc (video tối đa 500 MB)</small>
            <input type="file" id="fileInput" accept="image/*,video/*" multiple style="display:none"></div>
        <div class="thumbs" id="thumbs"></div>
        <details><summary>Tùy chọn</summary>
            <label><input type="checkbox" id="compress" checked> Nén ảnh cho nhẹ (khuyên dùng)</label>
            ${proj.watermark ? '<label><input type="checkbox" id="watermark" checked> Đóng dấu "' + proj.watermark + '"</label>' : ''}
            <label><input type="checkbox" id="copyUrl"> Tự copy link ảnh sau khi gửi</label>
        </details>
        <button class="btn" id="uploadBtn" disabled>Gửi về Drive</button>
        <div class="bar" id="bar"><i id="barFill"></i></div>
        <div class="status" id="status"></div>
        <div class="results" id="resultArea"></div>
        <button class="btn ghost" id="againBtn" style="display:none">Gửi thêm ảnh</button>`;

    let cat = proj.categories[0][0];
    proj.categories.forEach(([v, t]) => {
        const b = document.createElement('button');
        b.className = 'chip'; b.textContent = t; b.setAttribute('aria-pressed', v === cat);
        b.onclick = () => { cat = v; [...$('chips').children].forEach((c) => c.setAttribute('aria-pressed', c === b)); };
        $('chips').appendChild(b);
    });

    const fileInput = $('fileInput'), uploadBtn = $('uploadBtn'), status = $('status'), resultArea = $('resultArea');
    const setStatus = (t, c) => { status.innerText = t; status.style.color = c || 'var(--ink)'; };
    $('pick').onclick = () => fileInput.click();

    fileInput.onchange = () => {
        const fs = [...fileInput.files];
        const nv = fs.filter((f) => f.type.startsWith('video/')).length;
        $('hint').innerText = fs.length ? 'Đã chọn ' + (fs.length - nv) + ' ảnh' + (nv ? ' + ' + nv + ' video' : '') + ' - chạm để chọn lại' : 'Chọn được nhiều file cùng lúc (video tối đa 500 MB)';
        $('thumbs').innerHTML = '';
        fs.slice(0, 7).forEach((f) => {
            if (f.type.startsWith('video/')) { const v = document.createElement('div'); v.className = 'more'; v.textContent = '🎬 ' + Math.round(f.size / 1048576) + ' MB'; $('thumbs').appendChild(v); return; }
            const im = document.createElement('img'); im.src = URL.createObjectURL(f); $('thumbs').appendChild(im);
        });
        if (fs.length > 7) { const m = document.createElement('div'); m.className = 'more'; m.textContent = '+' + (fs.length - 7); $('thumbs').appendChild(m); }
        uploadBtn.disabled = !fs.length || !endpoint;
    };
    if (!endpoint) setStatus('Dự án này chưa được nối với Drive.', 'var(--err)');

    function processImage(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onerror = reject;
            reader.onload = (ev) => {
                const img = new Image();
                img.onerror = reject;
                img.onload = () => {
                    const canvas = $('canvas'), ctx = canvas.getContext('2d');
                    let w = img.width, h = img.height;
                    const max = 1600, zip = $('compress').checked;
                    if (zip) { if (w >= h && w > max) { h *= max / w; w = max; } else if (h > w && h > max) { w *= max / h; h = max; } }
                    canvas.width = w; canvas.height = h;
                    ctx.drawImage(img, 0, 0, w, h);
                    if ($('watermark') && $('watermark').checked && proj.watermark) {
                        const fs = Math.max(18, Math.round(w / 40));
                        ctx.font = 'bold ' + fs + 'px Arial'; ctx.fillStyle = 'rgba(255,255,255,0.8)';
                        ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 4;
                        ctx.fillText(proj.watermark, 20, h - 20); ctx.shadowBlur = 0;
                    }
                    resolve(canvas.toDataURL('image/jpeg', zip ? 0.8 : 0.95).split(',')[1]);
                };
                img.src = ev.target.result;
            };
            reader.readAsDataURL(file);
        });
    }

    // Gửi video: xin phiên tải lên trực tiếp vào Drive rồi gửi từng phần 8 MB (có thử lại)
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
    function putChunk(url, blob, s, e, total, onProg) {
        return new Promise((resolve, reject) => {
            const x = new XMLHttpRequest();
            x.open('PUT', url);
            x.setRequestHeader('Content-Range', 'bytes ' + s + '-' + (e - 1) + '/' + total);
            x.upload.onprogress = (ev) => onProg(s + ev.loaded);
            x.onload = () => resolve(x.status);
            x.onerror = () => reject(new Error('mất mạng'));
            x.send(blob);
        });
    }
    async function uploadVideo(file, idx, onProg) {
        if (file.size > 500 * 1048576) throw new Error('Video quá lớn (tối đa 500 MB)');
        const ext = (file.name.match(/\.(mp4|mov|m4v|webm|3gp|avi|mkv)$/i) || ['.mp4'])[0].toLowerCase();
        const start = await (await fetch(endpoint, { method: 'POST', body: JSON.stringify({
            action: 'vstart', project: pid, category: cat, type: file.type || 'video/mp4', size: file.size,
            name: pid + '_' + Date.now() + '_' + (idx + 1) + ext }) })).json();
        if (start.status !== 'success') throw new Error(start.message || 'không tạo được phiên tải');
        const CH = 8 * 1048576;                         // bội số của 256 KB theo yêu cầu của Drive
        let off = 0;
        while (off < file.size) {
            const end = Math.min(off + CH, file.size);
            let st = 0;
            for (let t = 0; t < 4; t++) {
                try { st = await putChunk(start.uploadUrl, file.slice(off, end), off, end, file.size, onProg); if (st === 200 || st === 201 || st === 308) break; }
                catch (e) { st = 0; }
                await sleep(1500 * (t + 1));
            }
            if (!(st === 200 || st === 201 || st === 308)) throw new Error('gửi video lỗi (' + st + ')');
            off = end;
            onProg(off);
        }
    }

    uploadBtn.onclick = async () => {
        const files = [...fileInput.files];
        if (!files.length) return;
        uploadBtn.disabled = true; $('againBtn').style.display = 'none';
        const urls = []; const failed = []; let nvOk = 0;
        resultArea.innerHTML = ''; resultArea.style.display = 'block';
        $('bar').style.display = 'block'; $('barFill').style.width = '0';

        for (let i = 0; i < files.length; i++) {
            setStatus('Đang gửi ' + (i + 1) + '/' + files.length + '...', 'var(--warn)');
            let ok = false;
            if (files[i].type.startsWith('video/')) {
                try {
                    await uploadVideo(files[i], i, (b) => {
                        const pc = Math.round(b / files[i].size * 100);
                        setStatus('Đang gửi video ' + (i + 1) + '/' + files.length + ': ' + pc + '%', 'var(--warn)');
                        $('barFill').style.width = Math.round((i + b / files[i].size) / files.length * 100) + '%';
                    });
                    ok = true; nvOk++;
                    resultArea.insertAdjacentHTML('beforeend', '<div>✅ 🎬 ' + files[i].name + ' đã gửi</div>');
                } catch (e) { resultArea.insertAdjacentHTML('beforeend', '<div>❌ 🎬 ' + files[i].name + ': ' + (e.message || 'lỗi') + '</div>'); }
                if (!ok) failed.push(files[i]);
                $('barFill').style.width = Math.round((i + 1) / files.length * 100) + '%';
                continue;
            }
            for (let t = 0; t < 2 && !ok; t++) {           // thử lại 1 lần nếu lỗi mạng
                try {
                    const base64 = await processImage(files[i]);
                    const res = await (await fetch(endpoint, { method: 'POST', body: JSON.stringify({
                        project: pid, base64, type: 'image/jpeg', category: cat,
                        name: pid + '_' + Date.now() + '_' + (i + 1) + '.jpg' }) })).json();
                    if (res.status !== 'success') throw new Error(res.message || 'lỗi');
                    urls.push(res.url); ok = true;
                    resultArea.insertAdjacentHTML('beforeend', '<div>✅ ' + files[i].name + ' → <a href="' + res.url + '" target="_blank">link</a></div>');
                } catch (e) { /* thử lại */ }
            }
            if (!ok) { failed.push(files[i]); resultArea.insertAdjacentHTML('beforeend', '<div>❌ ' + files[i].name + ' lỗi</div>'); }
            $('barFill').style.width = Math.round((i + 1) / files.length * 100) + '%';
        }

        if (failed.length) {
            setStatus('Xong. ' + (urls.length + nvOk) + ' file đã gửi, ' + failed.length + ' file lỗi - bấm "Gửi lại file lỗi".', 'var(--err)');
            const dt = new DataTransfer(); failed.forEach((f) => dt.items.add(f)); fileInput.files = dt.files;
            fileInput.onchange();
            uploadBtn.disabled = false; uploadBtn.innerText = 'Gửi lại file lỗi';
        } else {
            setStatus('✅ Đã gửi ' + (urls.length + nvOk) + ' file vào Drive.', 'var(--ok)');
            $('againBtn').style.display = 'block';
        }
        if ($('copyUrl').checked && urls.length) { try { await navigator.clipboard.writeText(urls.join('\n')); } catch (e) {} }
    };

    $('againBtn').onclick = () => {
        fileInput.value = ''; fileInput.onchange(); $('bar').style.display = 'none'; resultArea.style.display = 'none';
        resultArea.innerHTML = ''; setStatus(''); $('againBtn').style.display = 'none'; uploadBtn.innerText = 'Gửi về Drive';
    };
})();
</script>

</body>
</html>
